version: "1.0"
namespace: app
entries:
  - name: terminal_dep
    kind: ns.dependency
    component: wippy/terminal
    version: "*"
  - name: runner_verdict_test
    kind: function.lua
    meta:
      type: test
      suite: runner
    source: file://runner_verdict_test.lua
    method: run
    modules:
      - time
    imports:
      test: wippy.test:test
      verdict: wippy.test:runner_verdict

  - name: build_executor
    kind: exec.native

  - name: aggregate_fixtures
    kind: fs.directory
    directory: /tmp/wippy-aggregate-checks
    auto_init: true

  - name: env_storage
    kind: env.storage.os

  - name: framework_root
    kind: env.variable
    variable: WIPPY_FRAMEWORK_ROOT
    storage: app:env_storage

  - name: aggregate_checks_test
    kind: function.lua
    meta:
      type: test
      suite: build-checks
    source: file://aggregate_checks_test.lua
    method: run
    modules: [exec, fs, env, time]
    imports:
      test: wippy.test:test
