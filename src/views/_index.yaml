version: "1.0"
namespace: wippy.views
entries:
    - name: definition
      kind: ns.definition
      meta:
        description: UI view components
        title: Views
    - name: api_router
      kind: ns.requirement
      meta:
        value_kind: http.router
        description: Public API router for view endpoints
        parent: app.deps:__dependency.wippy.views
      targets:
        - entry: wippy.views.api:list_pages
          path: .meta.router
        - entry: wippy.views.api:list_pages.endpoint
          path: .meta.router
        - entry: wippy.views.api:list_components
          path: .meta.router
        - entry: wippy.views.api:list_components.endpoint
          path: .meta.router
        - entry: wippy.views.api:find_by_tag
          path: .meta.router
        - entry: wippy.views.api:find_by_tag.endpoint
          path: .meta.router
        - entry: wippy.views.api:render
          path: .meta.router
        - entry: wippy.views.api:render.endpoint
          path: .meta.router
        - entry: wippy.views.api:public_url
          path: .meta.router
        - entry: wippy.views.api:public_url.endpoint
          path: .meta.router
        - entry: wippy.views.api:list_routes
          path: .meta.router
        - entry: wippy.views.api:list_routes.endpoint
          path: .meta.router
    - name: server
      kind: ns.requirement
      meta:
        value_kind: http.service
        description: HTTP service that hosts the experimental Web Fragments gateway router. Defaults to app:gateway; override only if your http.service entry has a different id. A consumer needs no other fragment wiring — the gateway owns its own /@fragment router.
        parent: app.deps:__dependency.wippy.views
      default: app:gateway
      targets:
        - entry: wippy.views.api:fragment_router
          path: .meta.server
    - name: public_api_url
      kind: env.variable
      meta:
        comment: Public API URL for resolving component base URLs
      variable: PUBLIC_API_URL
    - name: env_storage
      kind: ns.requirement
      meta:
        value_kind: env.storage
        description: Environment storage for PUBLIC_API_URL
      targets:
        - entry: wippy.views:public_api_url
          path: .storage
    - name: env_contract
      kind: contract.definition
      meta:
        description: Contract interface for environment variable providers and consumers
        name: Environment Variable Provider Contract
        version: "1.0"
      methods:
        - description: Load environment variable mappings from provider
          input_schemas:
            - definition: |
                {
                  "type": "object",
                  "properties": {
                    "filter": {
                      "type": "object",
                      "description": "Optional filter criteria for mappings"
                    }
                  },
                  "additionalProperties": false
                }
              format: application/schema+json
          name: load_mappings
          output_schemas:
            - definition: |
                {
                  "type": "object",
                  "properties": {
                    "success": {"type": "boolean"},
                    "mappings": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "id": {"type": "string"},
                          "priority": {"type": "integer"},
                          "mappings": {"type": "object"}
                        },
                        "required": ["id", "priority", "mappings"]
                      }
                    },
                    "error": {"type": "string"}
                  },
                  "required": ["success"]
                }
              format: application/schema+json
        - description: Resolve environment variable values from context
          input_schemas:
            - definition: |
                {
                  "type": "object",
                  "properties": {
                    "context": {
                      "type": "object",
                      "description": "Context mapping from keys to environment variable names"
                    }
                  },
                  "required": ["context"]
                }
              format: application/schema+json
          name: resolve_env_values
          output_schemas:
            - definition: |
                {
                  "type": "object",
                  "properties": {
                    "success": {"type": "boolean"},
                    "resolved": {
                      "type": "object",
                      "description": "Resolved environment variable values"
                    },
                    "error": {"type": "string"}
                  },
                  "required": ["success"]
                }
              format: application/schema+json
    - name: env_contract_binding
      kind: contract.binding
      meta:
        comment: Contract binding for environment variable provider
        description: Implements the environment variable provider contract using env_loader library
      contracts:
        - contract: wippy.views:env_contract
          methods:
            load_mappings: wippy.views:env_loader
            resolve_env_values: wippy.views:env_loader
    - name: env_loader
      kind: library.lua
      meta:
        comment: Framework environment variable mapping loader
        description: Core framework library for loading and resolving environment variable mappings from registry
        type: framework.library
      source: file://env_loader.lua
      modules:
        - registry
        - env
    - name: env_mapping_schema
      kind: registry.entry
      meta:
        description: Schema definition for view.env_mapping registry entries
        name: Environment Variable Mapping Schema
        type: schema.definition
        version: "1.0"
      priority_conventions:
        application_mappings: 20-29
        environment_overrides: 30+
        framework_defaults: 0-9
        system_overrides: 10-19
      schema:
        properties:
            mappings:
                additionalProperties:
                    type: string
                description: Key-value pairs mapping view context names to environment variables
                type: object
            priority:
                default: 0
                description: Priority order for merging mappings (higher priority overrides lower)
                maximum: 100
                minimum: 0
                type: integer
        required:
            - mappings
        type: object
    - name: page_registry
      kind: library.lua
      meta:
        comment: Registry for managing virtual pages
        description: Provides functions to find and access virtual pages
      source: file://page_registry.lua
      modules:
        - registry
        - security
        - env
    - name: component_registry
      kind: library.lua
      meta:
        comment: Registry for managing view components (web components)
        description: Provides functions to find and access view components
      source: file://component_registry.lua
      modules:
        - registry
        - security
        - env
    - name: renderer
      kind: library.lua
      meta:
        comment: Page renderer for virtual pages
        description: Renders virtual pages with data and resources
      source: file://renderer.lua
      imports:
        env_loader: wippy.views:env_loader
        page_registry: wippy.views:page_registry
        resource_registry: wippy.views:resource_registry
      modules:
        - templates
        - funcs
        - json
        - env
    - name: resource_registry
      kind: library.lua
      meta:
        comment: Registry for managing page resources
        description: Provides functions to find and access page resources
      source: file://resource_registry.lua
      modules:
        - registry
    - name: bundled_meta
      kind: library.lua
      meta:
        comment: Fetches consumer-built wippy-meta.json (file:// refs resolved at build time)
        description: |
          Reads the wippy-meta.json that @wippy-fe/vite-plugin emits next to a
          consumer's app.html / index.js. Used by /pages/content/{id},
          /components/list, and /components/by-tag/{tag} as the single source
          of truth for view.page / view.component metadata when present.
          The file is read from the filesystem of the http.static mount that
          serves the entry URL, through wippy.views:read_static_meta; it is
          fetched over HTTP when views cannot be sure the HTTP server would
          serve that same file (see static_meta).
          Callers fall back to YAML-synthesis when fetch returns nil + nil.
          Misses and failures are logged at most once per hour per entry
          (deduplicated via the shared `bundled_meta_warn` memory store so
          handler-pool workers don't repeat each other).
      source: file://bundled_meta.lua
      imports:
        page_registry: wippy.views:page_registry
        component_registry: wippy.views:component_registry
        static_meta: wippy.views:static_meta
      modules:
        - funcs
        - http_client
        - json
        - logger
        - store
    - name: static_meta
      kind: library.lua
      meta:
        comment: Finds the http.static mount that serves a view entry URL and reads its wippy-meta.json
        description: |
          Chooses the mount the way the runtime's HTTP server routes the
          request (server, cleaned path, longest mount path, SPA mode) and
          refuses mounts whose middleware only the HTTP server applies.
          Endpoint overlap or unresolved routing also falls back to HTTP,
          which owns endpoint precedence and middleware.
          Opening the filesystem needs fs.get, which only
          wippy.views:read_static_meta has.
      source: file://static_meta.lua
      modules:
        - fs
        - registry
    - name: read_static_meta
      kind: function.lua
      meta:
        comment: Reads a view entry's wippy-meta.json from the http.static mount that serves it
        description: |
          The only views function that may open filesystems. The views API
          handlers call it through funcs, so they never hold fs.get.
      source: file://static_meta_reader.lua
      imports:
        static_meta: wippy.views:static_meta
      method: run
      security:
        actor:
          id: wippy.views:read_static_meta
        policies:
          - wippy.views:public_registry_runtime
          - wippy.views:public_metadata_fs_runtime
      pool:
        size: 4
        workers: 4
    - name: bundled_meta_warn
      kind: store.memory
      meta:
        comment: |
          Process-wide dedup of wippy-meta.json warnings and errors. Each
          entry and cause is logged at most once per hour (keys expire),
          regardless of which handler-pool worker observes it.
      max_size: 1000
      cleanup_interval: "1h"
    - name: public_registry_runtime
      kind: security.policy
      meta:
        comment: Public view API handlers may discover declared view pages, components, resources, and env mappings.
      policy:
        resources: '*'
        actions:
          - registry.get
          - registry.find
        effect: allow
    - name: public_env_runtime
      kind: security.policy
      meta:
        comment: Public view rendering may resolve browser-safe environment values.
      policy:
        resources:
          - PUBLIC_*
          - userspace.dataflow.env:web_host_origin
        actions:
          - env.get
        effect: allow
    - name: public_metadata_http_runtime
      kind: security.policy
      meta:
        comment: Public view API handlers may fetch bundled wippy-meta.json from declared component/page URLs.
      policy:
        resources:
          - http://*
          - https://*
        actions:
          - http_client.request
        effect: allow
    - name: public_metadata_fs_runtime
      kind: security.policy
      meta:
        comment: Only wippy.views:read_static_meta has this policy. It opens the filesystem behind an http.static mount to read the wippy-meta.json that mount serves. Any volume can back a mount, so the resource is not narrowed; the function only reads that one file.
      policy:
        resources: '*'
        actions:
          - fs.get
        effect: allow
    - name: public_metadata_reader_runtime
      kind: security.policy
      meta:
        comment: Public view API handlers may call wippy.views:read_static_meta, which reads wippy-meta.json from a mount filesystem for them.
      policy:
        resources:
          - wippy.views:read_static_meta
        actions:
          - funcs.call
        effect: allow
    - name: public_metadata_private_ip_runtime
      kind: security.policy
      meta:
        comment: Public view metadata self-fetch supports app-local component/page URLs.
      policy:
        resources: '*'
        actions:
          - http_client.private_ip
        effect: allow
    - name: public_metadata_store_runtime
      kind: security.policy
      meta:
        comment: Public view metadata fallback warnings are deduplicated through the package-owned memory store.
      policy:
        resources:
          - wippy.views:bundled_meta_warn
        actions:
          - store.get
          - store.key.get
          - store.key.set
        effect: allow
    - name: public_data_func_runtime
      kind: security.policy
      meta:
        comment: Template-backed public views may call data functions declared in view namespaces.
      policy:
        resources:
          - '*.views:*'
        actions:
          - funcs.call
        effect: allow
