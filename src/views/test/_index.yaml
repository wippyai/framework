version: "1.0"
namespace: app

entries:
  - name: dep.wippy.test
    kind: ns.dependency
    meta:
      description: Test framework
    component: wippy/test
    version: "*"

  - name: gateway
    kind: http.service
    meta:
      comment: Test HTTP server
    addr: :19086
    lifecycle:
      auto_start: true

  - name: api.public
    kind: http.router
    meta:
      comment: Test public API router
      server: gateway
    prefix: /api/public

  - name: envs
    kind: env.storage.os

  # Static mounts for the bundled_meta filesystem tests: a dedicated mount
  # (/static-fixture) and a catch-all mount (/), like the facade's.
  - name: test_static_fs
    kind: fs.directory
    meta:
      comment: Fixture pages with a valid, an invalid and no wippy-meta.json
    directory: ./fixtures/static

  - name: test_static
    kind: http.static
    meta:
      comment: Serves fixtures/static at /static-fixture
      server: gateway
    fs: test_static_fs
    path: /static-fixture

  - name: test_root_fs
    kind: fs.directory
    meta:
      comment: Fixture page served only by the catch-all mount
    directory: ./fixtures/root

  - name: test_root_static
    kind: http.static
    meta:
      comment: Catch-all mount serving fixtures/root at /
      server: gateway
    fs: test_root_fs
    path: /

  - name: test_templates
    kind: template.set
    meta:
      description: Test template set
    engine:
      delimiters:
        left: "{{"
        right: "}}"

  - name: test_tmpl_contact
    kind: template.jet
    meta:
      type: view.page
      name: test_tmpl_contact
      title: Contact
      icon: mail
      order: 4
      group: main
      group_icon: layout
      group_order: 1
      group_placement: sidebar
      secure: false
      public: true
      announced: true
      inline: false
    source: file://test_tmpl_contact.jet
    set: test_templates

  - name: test_tmpl_settings
    kind: template.jet
    meta:
      type: view.page
      name: test_tmpl_settings
      title: Settings
      icon: gear
      order: 20
      group: admin
      group_icon: settings
      group_order: 99
      group_placement: default
      secure: true
      public: false
      announced: true
      inline: false
    source: file://test_tmpl_settings.jet
    set: test_templates

  # Package test entries are excluded from the runtime projection. Keep this
  # executable regression in the harness that consumes the package.
  - name: component_registry_regression_test
    kind: function.lua
    meta:
      type: test
      suite: views
    source: file://component_registry_regression_test.lua
    method: run
    imports:
      test: wippy.test:test
      component_registry: wippy.views:component_registry
    modules:
      - registry

  # app:page_access_probe
  - name: page_access_probe
    kind: function.lua
    meta:
      scope: dev
      comment: Test seam - calls page_registry.can_access under a funcs.call-supplied security context
    source: file://page_access_probe.lua
    method: run
    imports:
      page_registry: wippy.views:page_registry

  # app:test_page_view_policy
  - name: test_page_view_policy
    kind: security.policy
    meta:
      scope: dev
      comment: Test-only policy granting view access to the fixture secure pages, used as a positive control for page_access_probe
    policy:
      resources:
        - page:wippy.views.test:test_secure
        - page:app:test_tmpl_settings
      actions:
        - view
      effect: allow

  # app:page_registry_test
  - name: page_registry_test
    kind: function.lua
    meta:
      type: test
      suite: views
      comment: Page registry tests
    source: file://page_registry_test.lua
    method: run
    imports:
      test: wippy.test:test
      page_registry: wippy.views:page_registry
    modules:
      - registry
      - security
      - funcs

  # app:component_registry_test
  - name: component_registry_test
    kind: function.lua
    meta:
      type: test
      suite: views
      comment: Component registry tests
    source: file://component_registry_test.lua
    method: run
    imports:
      test: wippy.test:test
      page_registry: wippy.views:page_registry
      component_registry: wippy.views:component_registry
    modules:
      - registry

  # app:resource_registry_test
  - name: resource_registry_test
    kind: function.lua
    meta:
      type: test
      suite: views
      comment: Resource registry tests
    source: file://resource_registry_test.lua
    method: run
    imports:
      test: wippy.test:test
      resource_registry: wippy.views:resource_registry
    modules:
      - registry

  # app:env_loader_test
  - name: env_loader_test
    kind: function.lua
    meta:
      type: test
      suite: views
      comment: Env loader tests
    source: file://env_loader_test.lua
    method: run
    imports:
      test: wippy.test:test
      env_loader: wippy.views:env_loader
    modules:
      - registry

  # app:bundled_meta_test
  - name: bundled_meta_test
    kind: function.lua
    meta:
      type: test
      suite: views
      comment: Bundled-meta projection tests (YAML-first precedence + nil-vs-empty override) and wippy-meta.json reads from static mounts
    source: file://bundled_meta_test.lua
    method: run
    imports:
      test: wippy.test:test
      bundled_meta: wippy.views:bundled_meta
    modules:
      - funcs
      - security

  # app:bundled_meta_probe
  - name: bundled_meta_probe
    kind: function.lua
    meta:
      scope: dev
      comment: Test seam - runs bundled_meta._load under a funcs.call-supplied security scope, so tests can check the handler policies
    source: file://bundled_meta_probe.lua
    method: run
    imports:
      bundled_meta: wippy.views:bundled_meta

  # app:public_security_test
  - name: public_security_test
    kind: function.lua
    meta:
      type: test
      suite: views
      comment: Public view API security policy tests
    source: file://public_security_test.lua
    method: run
    imports:
      test: wippy.test:test
    modules:
      - security
