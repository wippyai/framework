version: "1.0"
namespace: app

entries:
  - name: dep.wippy.test
    kind: ns.dependency
    meta:
      description: Test framework
    component: wippy/test
    version: "*"

  - name: gateway
    kind: http.service
    meta:
      comment: Test HTTP server
    addr: :19086
    lifecycle:
      auto_start: true

  - name: api.public
    kind: http.router
    meta:
      comment: Test public API router
      server: gateway
    prefix: /api/public

  - name: envs
    kind: env.storage.os

  # Static mounts for the wippy-meta.json tests: a dedicated mount
  # (/static-fixture), a catch-all mount (/) like the facade's, an SPA
  # mount, and a longer mount on a second server that views must ignore.
  - name: test_static_fs
    kind: fs.directory
    meta:
      scope: dev
      comment: Fixture pages with a valid, an invalid, an array, a directory and no wippy-meta.json
    directory: ./fixtures/static

  - name: test_static
    kind: http.static
    meta:
      scope: dev
      comment: Serves fixtures/static at /static-fixture
      server: gateway
    fs: test_static_fs
    path: /static-fixture

  - name: test_root_fs
    kind: fs.directory
    meta:
      scope: dev
      comment: Fixture page served only by the catch-all mount
    directory: ./fixtures/root

  - name: test_root_static
    kind: http.static
    meta:
      scope: dev
      comment: Catch-all mount serving fixtures/root at /
      server: gateway
    fs: test_root_fs
    path: /

  - name: test_spa_fs
    kind: fs.directory
    meta:
      scope: dev
      comment: SPA fixture; the SPA handler serves the whole request path from here
    directory: ./fixtures/spa

  - name: test_spa_static
    kind: http.static
    meta:
      scope: dev
      comment: SPA mount at /spa-fixture (legacy options form)
      server: gateway
    fs: test_spa_fs
    path: /spa-fixture
    options:
      spa: true
      index: index.html

  - name: other_gateway
    kind: http.service
    meta:
      scope: dev
      comment: Second HTTP server; its mounts are not the views API server's
    addr: :19087
    lifecycle:
      auto_start: true

  - name: test_other_static
    kind: http.static
    meta:
      scope: dev
      comment: Longer mount on the other server; views must not pick it for gateway pages
      server: other_gateway
    fs: test_root_fs
    path: /static-fixture/meta-page

  # app:test_bad_meta_page
  - name: test_bad_meta_page
    kind: registry.entry
    meta:
      scope: dev
      type: view.page
      name: test_bad_meta_page
      title: Bad meta fixture
      url: /static-fixture/bad-page
      entry_point: index.html
      public: true
      announced: false
      secure: false

  - name: test_templates
    kind: template.set
    meta:
      description: Test template set
    engine:
      delimiters:
        left: "{{"
        right: "}}"

  - name: test_tmpl_contact
    kind: template.jet
    meta:
      type: view.page
      name: test_tmpl_contact
      title: Contact
      icon: mail
      order: 4
      group: main
      group_icon: layout
      group_order: 1
      group_placement: sidebar
      secure: false
      public: true
      announced: true
      inline: false
    source: file://test_tmpl_contact.jet
    set: test_templates

  - name: test_tmpl_settings
    kind: template.jet
    meta:
      type: view.page
      name: test_tmpl_settings
      title: Settings
      icon: gear
      order: 20
      group: admin
      group_icon: settings
      group_order: 99
      group_placement: default
      secure: true
      public: false
      announced: true
      inline: false
    source: file://test_tmpl_settings.jet
    set: test_templates

  # Package test entries are excluded from the runtime projection. Keep this
  # executable regression in the harness that consumes the package.
  - name: component_registry_regression_test
    kind: function.lua
    meta:
      type: test
      suite: views
    source: file://component_registry_regression_test.lua
    method: run
    imports:
      test: wippy.test:test
      component_registry: wippy.views:component_registry
    modules:
      - registry

  # app:page_access_probe
  - name: page_access_probe
    kind: function.lua
    meta:
      scope: dev
      comment: Test seam - calls page_registry.can_access under a funcs.call-supplied security context
    source: file://page_access_probe.lua
    method: run
    imports:
      page_registry: wippy.views:page_registry

  # app:test_page_view_policy
  - name: test_page_view_policy
    kind: security.policy
    meta:
      scope: dev
      comment: Test-only policy granting view access to the fixture secure pages, used as a positive control for page_access_probe
    policy:
      resources:
        - page:wippy.views.test:test_secure
        - page:app:test_tmpl_settings
      actions:
        - view
      effect: allow

  # app:page_registry_test
  - name: page_registry_test
    kind: function.lua
    meta:
      type: test
      suite: views
      comment: Page registry tests
    source: file://page_registry_test.lua
    method: run
    imports:
      test: wippy.test:test
      page_registry: wippy.views:page_registry
    modules:
      - registry
      - security
      - funcs
      - env

  # app:component_registry_test
  - name: component_registry_test
    kind: function.lua
    meta:
      type: test
      suite: views
      comment: Component registry tests
    source: file://component_registry_test.lua
    method: run
    imports:
      test: wippy.test:test
      page_registry: wippy.views:page_registry
      component_registry: wippy.views:component_registry
    modules:
      - registry
      - env

  # app:resource_registry_test
  - name: resource_registry_test
    kind: function.lua
    meta:
      type: test
      suite: views
      comment: Resource registry tests
    source: file://resource_registry_test.lua
    method: run
    imports:
      test: wippy.test:test
      resource_registry: wippy.views:resource_registry
    modules:
      - registry

  # app:env_loader_test
  - name: env_loader_test
    kind: function.lua
    meta:
      type: test
      suite: views
      comment: Env loader tests
    source: file://env_loader_test.lua
    method: run
    imports:
      test: wippy.test:test
      env_loader: wippy.views:env_loader
    modules:
      - registry

  # app:bundled_meta_test
  - name: bundled_meta_test
    kind: function.lua
    meta:
      type: test
      suite: views
      comment: Bundled-meta projection tests (YAML-first precedence + nil-vs-empty override), wippy-meta.json loading over the mount filesystem and HTTP, failure messages and log dedup
    source: file://bundled_meta_test.lua
    method: run
    imports:
      test: wippy.test:test
      bundled_meta: wippy.views:bundled_meta
      static_meta: wippy.views:static_meta
    modules:
      - funcs
      - security
      - env
      - http_client
      - json

  # app:static_meta_test
  - name: static_meta_test
    kind: function.lua
    meta:
      type: test
      suite: views
      comment: Mount selection and mount filesystem reads for wippy-meta.json, and the read_static_meta permission boundary
    source: file://static_meta_test.lua
    method: run
    imports:
      test: wippy.test:test
      static_meta: wippy.views:static_meta
    modules:
      - funcs
      - security
      - registry

  # app:bundled_meta_probe
  - name: bundled_meta_probe
    kind: function.lua
    meta:
      scope: dev
      comment: Test seam - runs bundled_meta._load under a funcs.call-supplied security scope, so tests can check the handler policies
    source: file://bundled_meta_probe.lua
    method: run
    imports:
      bundled_meta: wippy.views:bundled_meta

  # app:fs_access_probe
  - name: fs_access_probe
    kind: function.lua
    meta:
      scope: dev
      comment: Test seam - tries fs.get under a funcs.call-supplied security scope
    source: file://fs_access_probe.lua
    method: run
    modules:
      - fs

  # app:public_security_test
  - name: public_security_test
    kind: function.lua
    meta:
      type: test
      suite: views
      comment: Public view API security policy tests
    source: file://public_security_test.lua
    method: run
    imports:
      test: wippy.test:test
    modules:
      - security

  # A root-router endpoint overrides an existing file under /static-fixture.
  - name: test_metadata_router
    kind: http.router
    meta:
      scope: dev
      server: gateway
    prefix: /

  - name: routed_metadata
    kind: function.lua
    meta:
      scope: dev
    source: file://routed_metadata.lua
    method: handler
    modules:
      - http

  - name: routed_metadata.endpoint
    kind: http.endpoint
    meta:
      scope: dev
      router: test_metadata_router
    func: routed_metadata
    method: GET
    path: /static-fixture/shadow-page/wippy-meta.json

  - name: denied_metadata
    kind: function.lua
    meta:
      scope: dev
    source: file://routed_metadata.lua
    method: denied
    modules:
      - http

  - name: denied_metadata.endpoint
    kind: http.endpoint
    meta:
      scope: dev
      router: test_metadata_router
    func: denied_metadata
    method: GET
    path: /static-fixture/guarded-page/wippy-meta.json
