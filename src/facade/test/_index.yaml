version: "1.0"
namespace: app

entries:
  - name: dep.wippy.test
    kind: ns.dependency
    meta:
      description: Test framework
    component: wippy/test
    version: "*"

  - name: gateway
    kind: http.service
    meta:
      comment: Test HTTP server
    addr: :19085
    lifecycle:
      auto_start: true

  - name: api.public
    kind: http.router
    meta:
      comment: Test public API router
      server: gateway
    prefix: /api/public

  - name: dep.wippy.facade
    kind: ns.dependency
    meta:
      description: Facade module under test
    component: wippy/facade
    version: "*"
    parameters:
      - name: server
        value: app:gateway
      - name: router
        value: app:api.public

  - name: security_policy_test
    kind: function.lua
    meta:
      type: test
      suite: facade
      comment: Facade handler security policy tests
    source: file://security_policy_test.lua
    method: run
    imports:
      test: wippy.test:test
    modules:
      - security
      - registry

  - name: config_contributors_test
    kind: function.lua
    meta:
      type: test
      suite: facade
      comment: Tests module configuration contributor validation and composition
    source: file://config_contributors_test.lua
    method: run
    imports:
      test: wippy.test:test
      config_contributors_core: wippy.facade:config_contributors_core
    modules:
      - fs
      - json


  # A real configuration contributor for host_url_test. It contributes
  # fe_facade_url only while app:contributed_host_url is a non-empty URL.
  - name: facade_config_contribute
    kind: function.lua
    meta:
      type: wippy.facade.config_contributor
      config_inputs:
        - fe_facade_url
      config_outputs:
        - fe_facade_url
      comment: Test contributor for fe_facade_url
    source: file://contributor_fixture.lua
    method: contribute
    modules:
      - registry
    security:
      actor:
        id: app:facade_config_contribute
      policies:
        - app:contributor_fixture_read

  - name: contributor_fixture_read
    kind: security.policy
    meta:
      comment: The test contributor reads only its test URL entry
    policy:
      resources:
        - app:contributed_host_url
      actions:
        - registry.get
      effect: allow

  - name: host_url_test
    kind: function.lua
    meta:
      type: test
      suite: facade
      comment: wippy.facade:host_url returns the URL the config endpoint serves
    source: file://host_url_test.lua
    method: run
    imports:
      test: wippy.test:test
    modules:
      - funcs
      - http_client
      - json
      - registry

  - name: config_dependency_test
    kind: function.lua
    meta:
      type: test
      suite: facade
      comment: Config handler and dependency wiring tests
    source: file://config_dependency_test.lua
    method: run
    imports:
      test: wippy.test:test
    modules:
      - json
      - registry

  # Tests
  - name: policy_compatibility_test
    kind: function.lua
    meta:
      type: test
      suite: facade
      comment: Real config endpoint policy compatibility for older and newer hosts
    source: file://policy_compatibility_test.lua
    method: run
    imports:
      test: wippy.test:test
    modules:
      - http_client
      - json
      - registry

  - name: shell_title_test
    kind: function.lua
    meta:
      type: test
      suite: facade
      comment: The rendered shell takes its page title from the app_title requirement
    source: file://shell_title_test.lua
    method: run
    imports:
      test: wippy.test:test
    modules:
      - http_client
      - registry

  - name: config_handler_test
    kind: function.lua
    meta:
      type: test
      suite: facade
      comment: Config handler tests
    source: file://config_handler_test.lua
    method: run
    imports:
      test: wippy.test:test
    modules:
      - fs
      - json
      - registry

  - name: theming_helpers_test
    kind: function.lua
    meta:
      type: test
      suite: facade
      comment: Tests for theming_helpers (CSS generation + file-ref resolution)
    source: file://theming_helpers_test.lua
    method: run
    imports:
      test: wippy.test:test
      theming_helpers: wippy.facade:theming_helpers
    modules:
      - fs
      - json
