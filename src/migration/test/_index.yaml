version: "1.0"
namespace: app

entries:
  - name: dep.wippy.test
    kind: ns.dependency
    meta:
      description: Test framework
    component: wippy/test
    version: ">=v0.3.0"

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database for migration tests
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: rollback_alpha
    kind: function.lua
    source: file://rollback_stub.lua
    method: revert

  - name: rollback_beta
    kind: function.lua
    source: file://rollback_stub.lua
    method: revert

  - name: rollback_legacy
    kind: function.lua
    source: file://rollback_stub.lua
    method: revert

  - name: rollback_newest
    kind: function.lua
    source: file://rollback_stub.lua
    method: revert

  - name: concurrent_sqlite_a
    kind: db.sql.sqlite
    file: ./.wippy/concurrency.db

  - name: concurrent_sqlite_b
    kind: db.sql.sqlite
    file: ./.wippy/concurrency.db

  - name: concurrent_pg_a
    kind: db.sql.postgres
    host: localhost
    port: 5433
    database: up_migration_concurrency
    username: kickside
    password: kickside
    options:
      sslmode: disable

  - name: concurrent_pg_b
    kind: db.sql.postgres
    host: localhost
    port: 5433
    database: up_migration_concurrency
    username: kickside
    password: kickside
    options:
      sslmode: disable

  - name: concurrency_test
    kind: function.lua
    meta:
      type: test
      suite: migration-concurrency
    source: file://concurrency_test.lua
    method: run
    modules: [sql, channel, env]
    imports:
      runner_lib: wippy.migration:runner
      repository: wippy.migration:repository
      test: wippy.test:test

  - name: test_os_env
    kind: env.storage.os

  - name: enable_postgres
    kind: env.variable
    storage: app:test_os_env
    variable: MIGRATION_TEST_POSTGRES
    default: "false"

  - name: concurrency_1
    kind: function.lua
    source: file://concurrency_fixture.lua
    method: first
    modules: [time]
    imports:
      migration_api: wippy.migration:migration

  - name: concurrency_2
    kind: function.lua
    source: file://concurrency_fixture.lua
    method: second
    modules: [time]
    imports:
      migration_api: wippy.migration:migration

  - name: concurrency_3
    kind: function.lua
    source: file://concurrency_fixture.lua
    method: third
    modules: [time]
    imports:
      migration_api: wippy.migration:migration

  # app:core_test
  - name: core_test
    kind: function.lua
    meta:
      type: test
      suite: migration-core
      comment: Tests for migration core DSL
    source: file://core_test.lua
    method: run
    imports:
      core: wippy.migration:core
      test: wippy.test:test

  # app:registry_test
  - name: registry_test
    kind: function.lua
    meta:
      type: test
      suite: migration-registry
      comment: Tests for migration registry queries
    source: file://registry_test.lua
    method: run
    imports:
      migration_registry: wippy.migration:registry
      test: wippy.test:test

  - name: runner_test
    kind: function.lua
    meta:
      type: test
      suite: migration-runner
      comment: SQL rollback ordering and filtering regressions
    source: file://runner_test.lua
    method: run
    modules: [sql]
    imports:
      runner: wippy.migration:runner
      repository: wippy.migration:repository
      migration_registry: wippy.migration:registry
      test: wippy.test:test

  - name: runner_alias_test
    kind: function.lua
    meta:
      type: test
      suite: migration-runner
    source: file://runner_alias_test.lua
    method: run
    modules: [sql, funcs, env]
    imports:
      runner: wippy.migration:runner
      repository: wippy.migration:repository
      migration_registry: wippy.migration:registry
      migration_api: wippy.migration:migration
      test: wippy.test:test

  - name: alias_mig_one
    kind: function.lua
    meta:
      type: migration
      target_db: app:db
      description: Alias fixture with a string alias
      timestamp: "2025-01-01T00:00:00Z"
      alias: app.legacy:alias_mig_one
    source: file://alias_mig_one.lua
    imports:
      migration: wippy.migration:migration
    method: migrate

  - name: alias_mig_two
    kind: function.lua
    meta:
      type: migration
      target_db: app:db
      description: Alias fixture with an array of aliases
      timestamp: "2025-01-02T00:00:00Z"
      alias: [app.legacy:alias_mig_two_a, app.legacy:alias_mig_two_b]
    source: file://alias_mig_two.lua
    imports:
      migration: wippy.migration:migration
    method: migrate

  - name: repository_schema_test
    kind: function.lua
    meta:
      type: test
      suite: migration-repository
    source: file://repository_schema_test.lua
    method: run
    modules: [sql, registry, env, uuid]
    imports:
      repository: wippy.migration:repository
      test: wippy.test:test

  - name: batched_test
    kind: function.lua
    meta:
      type: test
      suite: migration-batched
    source: file://batched_test.lua
    method: run
    modules: [sql, env, time, channel, registry, uuid]
    imports:
      migration_api: wippy.migration:migration
      repository: wippy.migration:repository
      test: wippy.test:test

  - name: external_batch_test
    kind: function.lua
    meta:
      type: test
      suite: migration-external-batched
    source: file://external_batch_test.lua
    method: run
    modules: [sql, env, uuid]
    imports:
      migration_api: wippy.migration:migration
      repository: wippy.migration:repository
      test: wippy.test:test
