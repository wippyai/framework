version: "1.0"
namespace: app

entries:
  - name: db
    kind: db.sql.sqlite
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: ledger_hash_fixture
    kind: function.lua
    meta:
      type: migration
      target_db: app:db
      timestamp: "2026-01-01T00:00:00Z"
      tags:
        - ledger-hash
      description: Fixture table for the single-step ledger hash test
    source: file://ledger_hash_fixture.lua
    method: migrate
    imports:
      migration: wippy.migration:migration
