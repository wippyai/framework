version: "1.0"
namespace: wippy.test

entries:
  - name: definition
    kind: ns.definition
    meta:
      title: Test
      description: BDD-style testing framework with assertions and mocking

  # dependency: wippy/terminal (provides terminal.host for process execution)
  - name: terminal_dep
    kind: ns.dependency
    component: wippy/terminal
    version: "*"

  - name: env_storage
    kind: env.storage.os

  - name: require_cases
    kind: env.variable
    variable: WIPPY_TEST_REQUIRE_CASES
    storage: wippy.test:env_storage

  # wippy.test:terminal
  - name: terminal
    kind: library.lua
    meta:
      comment: Terminal output helpers for test display
    source: file://terminal.lua
    modules:
      - io

  # wippy.test:registry
  - name: registry
    kind: library.lua
    meta:
      comment: Registry queries for test discovery and organization
    source: file://registry.lua
    modules:
      - time
    imports:
      base_registry: :registry

  # wippy.test:discovery
  - name: discovery
    kind: library.lua
    meta:
      comment: Test discovery, sorting, and filtering
    source: file://discovery.lua

  # wippy.test:display
  - name: display
    kind: library.lua
    meta:
      comment: TUI rendering for test results
    source: file://display.lua
    imports:
      terminal: wippy.test:terminal

  # wippy.test:test
  - name: test
    kind: library.lua
    meta:
      comment: BDD-style testing framework with direct assertions and mocking
    source: file://test.lua
    modules:
      - time
      - json
      - ctx

  - name: runner_host
    kind: process.host
    meta:
      comment: Isolated host for runner-owned test commands
    lifecycle:
      auto_start: true

  # wippy.test:runner_policy
  - name: runner_policy
    kind: security.policy
    meta:
      comment: Root scope for the CLI test runner. The runner discovers and executes arbitrary registry entries, so it requires unrestricted access; the CLI launcher installing it is the trust anchor.
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # wippy.test:runner
  - name: runner_verdict
    kind: library.lua
    meta:
      comment: Fail closed when a test process drops declared BDD cases or aborts a hook.
    source: file://runner_verdict.lua

  # wippy.test:runner
  - name: runner_entry
    kind: process.lua
    meta:
      comment: Runner-owned test execution process
    source: file://runner_entry.lua
    method: run
    modules:
      - funcs
      - channel
      - time

  # wippy.test:runner
  - name: runner
    kind: process.lua
    meta:
      comment: CLI test runner with live progress display
      command:
        name: test
        short: Run tests
        use_case: test
        security:
          actor:
            id: wippy.test:runner
          policies:
            - wippy.test:runner_policy
    source: file://runner.lua
    method: main
    modules:
      - io
      - env
      - time
      - channel
    imports:
      terminal: wippy.test:terminal
      registry: wippy.test:registry
      discovery: wippy.test:discovery
      display: wippy.test:display
      verdict: wippy.test:runner_verdict

  # wippy.test:self_test
  - name: self_test
    kind: function.lua
    meta:
      type: test
      suite: test-framework
      comment: Self-test for the test framework
    source: file://self_test.lua
    method: run
    imports:
      test: wippy.test:test

  - name: benchmark_output
    kind: fs.directory
    directory: /tmp/wippy-benchmarks
    auto_init: true

  - name: benchmark_revision
    kind: env.variable
    variable: WIPPY_BENCH_REVISION
    storage: wippy.test:env_storage

  - name: benchmark_runtime
    kind: env.variable
    variable: WIPPY_BENCH_RUNTIME
    storage: wippy.test:env_storage

  - name: benchmark_framework_revision
    kind: env.variable
    variable: WIPPY_BENCH_FRAMEWORK_REVISION
    storage: wippy.test:env_storage

  - name: benchmark_exact_allocations
    kind: env.variable
    variable: WIPPY_BENCH_EXACT_ALLOCATIONS
    storage: wippy.test:env_storage

  - name: benchmark
    kind: library.lua
    source: file://benchmark.lua
    modules: [fs, json, env, io, system, http_client]

  - name: benchmark_test
    kind: function.lua
    meta:
      type: test
      suite: test-framework
    source: file://benchmark_test.lua
    method: run
    modules: [fs, json, system, env]
    imports:
      benchmark: wippy.test:benchmark
      test: wippy.test:test
