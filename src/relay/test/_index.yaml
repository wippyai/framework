version: "1.0"
namespace: app

entries:
  - name: dep.wippy.test
    kind: ns.dependency
    meta:
      description: Test framework
    component: wippy/test
    version: ">=v0.2.0"

  - name: user
    kind: registry.entry
    meta:
      comment: Policy group for user relay hubs under test

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # app:consts_test
  - name: consts_test
    kind: function.lua
    meta:
      name: Relay Constants Test
      type: test
      suite: relay
      comment: Tests relay configuration constants and derived values
      group: Relay
      tags:
        - relay
        - constants
        - tests
    source: file://consts_test.lua
    imports:
      consts: wippy.relay:consts
      test: wippy.test:test
    modules:
      - env
      - time
    method: run

  # app:user_test
  - name: user_test
    kind: function.lua
    meta:
      name: Relay User Hub Test
      type: test
      suite: relay
      comment: Tests user-hub websocket payload compatibility.
      group: Relay
      tags:
        - relay
        - user
        - tests
    source: file://user_test.lua
    imports:
      consts: wippy.relay:consts
      test: wippy.test:test
      user: wippy.relay:user
    modules:
      - time
      - security
      - env
    method: run

  # app:central_test
  - name: central_test
    kind: function.lua
    meta:
      name: Relay Central Identity Test
      type: test
      suite: relay
      comment: Tests user identity and scope propagation from websocket metadata.
      group: Relay
      tags:
        - relay
        - identity
        - tests
    source: file://central_test.lua
    imports:
      central: wippy.relay:central
      test: wippy.test:test
    modules:
      - time
    method: run

  - name: runtime_plugin_policy
    kind: security.policy
    groups:
      - app:user
    policy:
      resources: '*'
      actions:
        - process.spawn
        - process.spawn.linked
        - process.spawn.monitored
        - process.host
        - process.cancel
      effect: allow

  - name: relay_runtime_plugin
    kind: process.lua
    source: file://relay_runtime_plugin.lua
    method: run

  - name: relay_runtime_test
    kind: function.lua
    meta:
      type: test
      suite: relay-runtime
      timeout: 25s
    source: file://relay_runtime_test.lua
    imports:
      test: wippy.test:test
      benchmark: wippy.test:benchmark
      consts: wippy.relay:consts
    modules:
      - time
      - json
      - security
      - env
    method: run

  - name: relay_runtime_benchmark
    kind: function.lua
    meta:
      type: test
      suite: relay-benchmark
      timeout: 120s
    source: file://relay_runtime_test.lua
    imports:
      test: wippy.test:test
      benchmark: wippy.test:benchmark
      consts: wippy.relay:consts
    modules:
      - time
      - json
      - security
      - env
    method: benchmark

  - name: runtime_env_storage
    kind: env.storage.os

  - name: runtime_bench_samples
    kind: env.variable
    variable: WIPPY_BENCH_SAMPLES
    storage: app:runtime_env_storage

  - name: runtime_bench_warmup
    kind: env.variable
    variable: WIPPY_BENCH_WARMUP
    storage: app:runtime_env_storage

  - name: runtime_bench_size
    kind: env.variable
    variable: WIPPY_BENCH_SIZE
    storage: app:runtime_env_storage

  - name: relay_runtime_finished_plugin
    kind: process.lua
    source: file://relay_runtime_plugin.lua
    method: finish
