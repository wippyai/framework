version: "1.0"
namespace: app

entries:
  - name: dep.wippy.test
    kind: ns.dependency
    meta:
      description: Test framework
    component: wippy/test
    version: ">=v0.2.0"

  - name: user
    kind: registry.entry
    meta:
      comment: Policy group for user relay hubs under test

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: db
    kind: db.sql.sqlite
    file: ":memory:"

  - name: isolation_plugin_policy
    kind: security.policy
    groups: [app:user]
    policy:
      resources: [app:isolation_plugin]
      actions: [process.spawn, process.spawn.linked, process.spawn.monitored]
      effect: allow

  - name: isolation_host_policy
    kind: security.policy
    groups: [app:user]
    policy:
      resources: [app:processes]
      actions: [process.host]
      effect: allow

  - name: isolation_cleanup_policy
    kind: security.policy
    groups: [app:user]
    policy:
      resources: '*'
      actions: [process.cancel]
      effect: allow

  - name: isolation_client
    kind: process.lua
    source: file://isolation_fixture.lua
    imports:
      consts: wippy.relay:consts
    modules: [security, sql]
    method: client

  - name: isolation_plugin
    kind: process.lua
    meta:
      type: relay.plugin
      command_prefix: probe_
      default_host: app:processes
    source: file://isolation_fixture.lua
    imports:
      consts: wippy.relay:consts
    modules: [security, sql]
    method: plugin

  - name: isolation_test
    kind: function.lua
    meta:
      type: test
      suite: relay
    source: file://isolation_test.lua
    imports:
      consts: wippy.relay:consts
      test: wippy.test:test
    modules: [time, json, sql]
    method: run

  # app:consts_test
  - name: consts_test
    kind: function.lua
    meta:
      name: Relay Constants Test
      type: test
      suite: relay
      comment: Tests relay configuration constants and derived values
      group: Relay
      tags:
        - relay
        - constants
        - tests
    source: file://consts_test.lua
    imports:
      consts: wippy.relay:consts
      test: wippy.test:test
    modules:
      - env
      - time
    method: run

  # app:user_test
  - name: user_test
    kind: function.lua
    meta:
      name: Relay User Hub Test
      type: test
      suite: relay
      comment: Tests user-hub websocket payload compatibility.
      group: Relay
      tags:
        - relay
        - user
        - tests
    source: file://user_test.lua
    imports:
      consts: wippy.relay:consts
      test: wippy.test:test
      user: wippy.relay:user
    modules:
      - time
      - security
    method: run

  # app:central_test
  - name: central_test
    kind: function.lua
    meta:
      name: Relay Central Identity Test
      type: test
      suite: relay
      comment: Tests user identity and scope propagation from websocket metadata.
      group: Relay
      tags:
        - relay
        - identity
        - tests
    source: file://central_test.lua
    imports:
      central: wippy.relay:central
      test: wippy.test:test
    modules:
      - time
    method: run
