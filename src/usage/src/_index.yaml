version: "1.0"
namespace: wippy.usage

entries:
  - name: definition
    kind: ns.definition
    meta:
      title: Usage
      description: Token usage tracking for LLM applications

  # Requirements
  - name: target_db
    kind: ns.requirement
    meta:
      description: "Application database ID for usage tracking"
    targets:
      - entry: wippy.usage:target_db
        path: .default
      - entry: wippy.usage.migrations:01_create_token_usage_table
        path: ".meta.target_db"
      - entry: wippy.usage.migrations:02_create_token_usage_cache_writes
        path: ".meta.target_db"
      - entry: wippy.usage.migrations:03_index_token_usage_time
        path: ".meta.target_db"
      - entry: wippy.usage:retention_db_access
        path: ".policy.resources"

  # Dependencies
  - name: dep.wippy.migration
    kind: "ns.dependency"
    meta:
      description: "Migration component"
    component: "wippy/migration"
    version: ">=v0.0.7"

  - name: dep.wippy.llm
    kind: "ns.dependency"
    meta:
      description: "LLM component defining the usage_tracker contract this module binds"
    component: "wippy/llm"
    version: ">=v0.4.0"

  # wippy.usage:token_usage_repo
  - name: token_usage_repo
    kind: library.lua
    meta:
      comment: Repository for managing token usage data
      tags:
        - tokens
        - usage
      description: Track and analyze LLM token consumption
    source: file://token_usage_repo.lua
    modules:
      - sql
      - json
      - uuid
      - time
      - registry

  # wippy.usage:usage_tracker
  - name: usage_tracker
    kind: function.lua
    meta:
      comment: Usage tracker contract handler for recording LLM token usage
      tags:
        - usage
        - tokens
        - tracking
    source: file://usage_tracker.lua
    modules:
      - security
      - ctx
      - logger
    imports:
      token_usage_repo: wippy.usage:token_usage_repo
    method: track_usage
    pool:
      max_size: 25

  # wippy.usage:usage_tracker_binding
  - name: usage_tracker_binding
    kind: contract.binding
    meta:
      comment: Usage tracker contract binding to token usage repository
      tags:
        - usage
        - binding
        - contract
    contracts:
      - contract: wippy.llm:usage_tracker
        default: true
        methods:
          track_usage: wippy.usage:usage_tracker

  # wippy.usage:policy
  - name: policy
    kind: registry.entry
    meta:
      comment: Token usage retention window and bounded prune batch size
      retention:
        token_usage: "90d"
        batch_token_usage: 500

  # wippy.usage:retention_policy
  - name: retention_policy
    kind: library.lua
    meta:
      comment: Reads and validates the token usage retention policy
    source: file://retention_policy.lua
    modules:
      - registry

  # wippy.usage:retention
  - name: retention
    kind: function.lua
    meta:
      type: kickside.retention.owner
      comment: Prunes token usage records past the retention window in bounded batches
    source: file://retention.lua
    method: run
    modules:
      - time
    imports:
      token_usage_repo: wippy.usage:token_usage_repo
      retention_policy: wippy.usage:retention_policy
    security:
      actor: { id: system:wippy.usage.retention }
      policies:
        - wippy.usage:retention_db_access
        - wippy.usage:retention_registry_read

  # wippy.usage:retention_db_access
  - name: retention_db_access
    kind: security.policy
    meta:
      comment: Lets the retention owner open the usage database
    policy:
      resources: app:db
      actions: [db.get]
      effect: allow

  # wippy.usage:retention_registry_read
  - name: retention_registry_read
    kind: security.policy
    meta:
      comment: Lets the retention owner read the usage database requirement and the retention policy
    policy:
      resources:
        - wippy.usage:target_db
        - wippy.usage:policy
      actions: [registry.get]
      effect: allow
