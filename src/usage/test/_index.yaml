version: "1.0"
namespace: app

entries:
  - name: dep.wippy.test
    kind: ns.dependency
    meta:
      description: Test framework
    component: wippy/test
    version: ">=v0.2.0"

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database for usage tests
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # app:token_usage_repo_test
  - name: token_usage_repo_test
    kind: function.lua
    meta:
      name: Token Usage Repository Test
      type: test
      comment: Tests for the token usage repository functionality
      group: LLM / Usage Tests
      tags:
        - usage
        - tokens
        - database
        - tests
      description: Tests for token usage tracking
    source: file://token_usage_repo_test.lua
    modules:
      - sql
      - uuid
      - json
      - time
      - registry
    imports:
      test: wippy.test:test
      token_usage_repo: wippy.usage:token_usage_repo
    method: run_tests
