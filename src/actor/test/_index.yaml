version: "1.0"
namespace: app

entries:
  - name: dep.wippy.test
    kind: ns.dependency
    meta:
      description: Test framework
    component: wippy/test
    version: ">=v0.2.0"

  # app:actor_test
  - name: actor_test
    kind: function.lua
    meta:
      name: Actor Library Test
      type: test
      suite: actor
      comment: Tests the actor library's messaging and event handling capabilities
      group: Actor Framework
      tags:
        - actor
        - library
        - message-passing
        - concurrency
        - tests
    source: file://actor_test.lua
    imports:
      actor: wippy.actor:actor
      test: wippy.test:test
    modules:
      - time
      - json
    method: run

  - name: runtime_processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: actor_runtime_fixture
    kind: process.lua
    source: file://actor_runtime_fixture.lua
    imports:
      actor: wippy.actor:actor
    modules:
      - time
    method: run

  - name: actor_runtime_test
    kind: function.lua
    meta:
      type: test
      suite: actor-runtime
      timeout: 20s
    source: file://actor_runtime_test.lua
    imports:
      actor: wippy.actor:actor
      test: wippy.test:test
      benchmark: wippy.test:benchmark
    modules:
      - system
      - time
      - env
    method: run

  - name: actor_runtime_benchmark
    kind: function.lua
    meta:
      type: test
      suite: actor-benchmark
      timeout: 120s
    source: file://actor_runtime_test.lua
    imports:
      actor: wippy.actor:actor
      test: wippy.test:test
      benchmark: wippy.test:benchmark
    modules:
      - system
      - time
      - env
    method: benchmark

  - name: actor_lifecycle_benchmark
    kind: function.lua
    meta:
      type: test
      suite: actor-benchmark
      timeout: 120s
    source: file://actor_runtime_test.lua
    imports:
      actor: wippy.actor:actor
      test: wippy.test:test
      benchmark: wippy.test:benchmark
    modules:
      - system
      - time
      - env
    method: lifecycle

  - name: actor_resident_fixture
    kind: process.lua
    source: file://actor_runtime_fixture.lua
    imports:
      actor: wippy.actor:actor
    modules:
      - time
    method: resident

  - name: actor_runtime_resident_test
    kind: function.lua
    meta:
      type: test
      suite: actor-runtime
      timeout: 25s
    source: file://actor_resident_test.lua
    imports:
      test: wippy.test:test
      benchmark: wippy.test:benchmark
    modules:
      - time
      - env
    method: run

  - name: actor_resident_benchmark
    kind: function.lua
    meta:
      type: test
      suite: actor-benchmark
      timeout: 120s
    source: file://actor_resident_test.lua
    imports:
      test: wippy.test:test
      benchmark: wippy.test:benchmark
    modules:
      - time
      - env
    method: benchmark

  - name: runtime_env_storage
    kind: env.storage.os

  - name: runtime_bench_samples
    kind: env.variable
    variable: WIPPY_BENCH_SAMPLES
    storage: app:runtime_env_storage

  - name: runtime_bench_warmup
    kind: env.variable
    variable: WIPPY_BENCH_WARMUP
    storage: app:runtime_env_storage

  - name: runtime_bench_size
    kind: env.variable
    variable: WIPPY_BENCH_SIZE
    storage: app:runtime_env_storage

  - name: runtime_bench_memory_operations
    kind: env.variable
    variable: WIPPY_BENCH_MEMORY_OPERATIONS
    storage: app:runtime_env_storage
