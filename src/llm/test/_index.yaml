      claude_structured: wippy.llm.claude:structured_output
      bedrock_generate: wippy.llm.bedrock:generate
      bedrock_structured: wippy.llm.bedrock:structured_output
      google_generate: wippy.llm.google:generate
      google_structured: wippy.llm.google:structured_output
      test: wippy.test:test
    method: run_tests

