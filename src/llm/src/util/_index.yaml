version: "1.0"
namespace: wippy.llm.util

entries:
  # wippy.llm.util:compress
  - name: compress
    kind: library.lua
    meta:
      type: library
      comment: Intelligent content compression library that adapts to model context limits
      tags:
        - llm
        - compression
        - summarization
        - text-processing
    source: file://compress.lua
    modules:
      - text
      - json
    imports:
      llm: wippy.llm:llm
      models: wippy.llm.discovery:models
    
  # wippy.llm.util:transport
  - name: transport
    kind: library.lua
    meta:
      type: library
      comment: Shared provider HTTP transport - context config lookup, method dispatch, bounded retry and health classification
      tags:
        - llm
        - http
        - retry
    source: file://transport.lua
    modules:
      - time

  - name: route
    kind: library.lua
    source: file://route.lua

  # wippy.llm.util:fallback
  - name: fallback
    kind: library.lua
    meta:
      type: library
      comment: Fallback chain policy - route order, switching decisions, call budget and failure summaries
      tags:
        - llm
        - fallback
    source: file://fallback.lua

  - name: thinking
    kind: library.lua
    source: file://thinking.lua
