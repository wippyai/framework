version: "1.0"
namespace: app

entries:
  - name: dep.wippy.test
    kind: ns.dependency
    meta:
      description: Test framework
    component: wippy/test
    version: ">=v0.4.0"

  - name: env_storage
    kind: env.storage.os
    meta:
      type: envstorage

  # app:agent_integration_test
  - name: agent_integration_test
    kind: function.lua
    meta:
      name: Agent Integration Test
      type: test
      comment: Comprehensive integration tests for the full agent system chain - Raw Spec to Compiler to Agent to Tool Caller to Real Tools
      group: Agent Framework
      tags:
        - agents
        - integration
        - compiler
        - tool_caller
        - parallel_execution
        - tool_aliases
        - tests
    source: file://agent_integration_test.lua
    modules:
      - time
      - json
      - env
    imports:
      prompt: wippy.llm:prompt
      agent: wippy.agent:agent
      output: wippy.llm:output
      compiler: wippy.agent.compiler:compiler
      test: wippy.test:test
      tool_caller: wippy.agent.tools:caller
    method: run_tests

  # app:agent_memory_test
  - name: agent_memory_test
    kind: function.lua
    meta:
      name: Agent Memory Processing Test
      type: test
      comment: Detailed tests for agent memory contract integration and processing logic
      group: Agent Framework
      tags:
        - agents
        - memory
        - contracts
        - processing
        - tests
    source: file://agent_memory_test.lua
    modules:
      - time
      - json
    imports:
      prompt: wippy.llm:prompt
      agent: wippy.agent:agent
      output: wippy.llm:output
      test: wippy.test:test
    method: run_tests

  # app:agent_test
  - name: agent_test
    kind: function.lua
    meta:
      name: Agent Test
      type: test
      comment: Tests the agent runner library functionality for executing LLM agents with conversation and tool support
      group: Agent Framework
      tags:
        - agents
        - llm
        - conversation
        - tools
        - tests
    source: file://agent_test.lua
    modules:
      - time
      - json
      - env
    imports:
      prompt: wippy.llm:prompt
      agent: wippy.agent:agent
      agent_registry: wippy.agent.discovery:registry
      llm: wippy.llm:llm
      output: wippy.llm:output
      test: wippy.test:test
      tool_caller: wippy.agent.tools:caller
    method: run_tests

  # app:context_test
  - name: context_test
    kind: function.lua
    meta:
      name: Agent Context Test
      type: test
      comment: Tests the agent context manager functionality for loading, compilation, and runtime switching
      group: Agent Framework
      tags:
        - agents
        - context
        - runtime
        - switching
        - tests
    source: file://context_test.lua
    imports:
      context: wippy.agent:context
      compiler: wippy.agent.compiler:compiler
      test: wippy.test:test
    method: run_tests

  - name: lifecycle_controller_test
    kind: function.lua
    meta:
      name: Agent Lifecycle Controller Test
      type: test
      comment: Tests agent transition ordering, refresh, and error state
      group: Agent Framework
      tags: [agents, lifecycle, tests]
    source: file://lifecycle_controller_test.lua
    imports:
      lifecycle_controller: wippy.agent:lifecycle_controller
      test: wippy.test:test
    method: run_tests

  - name: behavior_controls_test
    kind: function.lua
    meta:
      type: test
      group: Agent Framework
    source: file://behavior_controls_test.lua
    imports:
      behavior_controls: wippy.agent:behavior_controls
      test: wippy.test:test
    method: run_tests

  # app:lifecycle_runtime_test
  - name: lifecycle_runtime_test
    kind: function.lua
    meta:
      name: Agent Lifecycle Runtime Test
      type: test
      comment: Unit tests for optional trait-owned lifecycle contract dispatch
      group: Agent Framework
      tags:
        - agents
        - lifecycle
        - traits
        - contracts
        - tests
    source: file://lifecycle_runtime_test.lua
    imports:
      lifecycle_runtime: wippy.agent:lifecycle_runtime
      test: wippy.test:test
    method: run_tests

  # app:checkpoint_runtime_test
  - name: checkpoint_runtime_test
    kind: function.lua
    meta:
      name: Agent Checkpoint Runtime Test
      type: test
      comment: Unit tests for optional trait-owned checkpoint contract dispatch
      group: Agent Framework
      tags:
        - agents
        - checkpoint
        - traits
        - contracts
        - tests
    source: file://checkpoint_runtime_test.lua
    imports:
      checkpoint_runtime: wippy.agent:checkpoint_runtime
      test: wippy.test:test
    method: run_tests

  # app:compiler_compiler_test
  - name: compiler_compiler_test
    kind: function.lua
    meta:
      name: Agent Compiler Test
      type: test
      comment: Tests the agent compiler functionality for materializing raw agent specs into runnable agents
      group: Agent Framework
      tags:
        - agents
        - compiler
        - traits
        - delegates
        - tests
    source: file://compiler/compiler_test.lua
    imports:
      compiler: wippy.agent.compiler:compiler
      test: wippy.test:test
    method: run_tests

  # app:discovery_registry_test
  - name: discovery_registry_test
    kind: function.lua
    meta:
      name: Agent Registry Test
      type: test
      comment: Tests the agent registry library functionality for discovering and loading gen1 agents
      group: Agent Framework
      tags:
        - agents
        - registry
        - discovery
        - tests
    source: file://discovery/registry_test.lua
    imports:
      agent_registry: wippy.agent.discovery:registry
      test: wippy.test:test
    method: run_tests

  # app:discovery_selector_test
  - name: discovery_selector_test
    kind: function.lua
    meta:
      name: Agent Selector Test
      type: test
      comment: Tests the agent selector functionality for selecting agents based on user prompt analysis
      group: Agent Framework
      tags:
        - selector
        - discovery
        - agent_selection
        - llm_integration
        - tests
    source: file://discovery/selector_test.lua
    modules:
      - env
    imports:
      selector: wippy.agent.discovery:selector
      test: wippy.test:test
    method: run_tests

  # app:discovery_tools_test
  - name: discovery_tools_test
    kind: function.lua
    meta:
      name: Tools Library Test
      type: test
      comment: Tests the tool resolver library functionality for discovering and managing tools
      group: Agent Framework
      tags:
        - llm
        - tools
        - resolver
        - tests
      depends_on:
        - ns:wippy.test
    source: file://discovery/tools_test.lua
    modules:
      - json
    imports:
      tools: wippy.agent.discovery:tools
      test: wippy.test:test
    method: run_tests

  # app:discovery_traits_test
  - name: discovery_traits_test
    kind: function.lua
    meta:
      name: Agent Traits Test
      type: test
      comment: Tests the agent traits library
      group: Agent Framework
      tags:
        - traits
        - registry
        - discovery
        - tests
      depends_on:
        - traits
    source: file://discovery/traits_test.lua
    imports:
      test: wippy.test:test
      traits: wippy.agent.discovery:traits
    method: run_tests

  # app:tools_caller_test
  - name: tools_caller_test
    kind: function.lua
    meta:
      name: Tool Caller Test
      type: test
      comment: Tests the unified tool caller functionality for sequential and parallel tool execution
      group: Agent Framework
      tags:
        - tools
        - execution
        - parallel
        - sequential
        - tests
    source: file://tools/caller_test.lua
    modules:
      - env
      - time
      - funcs
    imports:
      test: wippy.test:test
      tool_caller: wippy.agent.tools:caller
      attention_guard: wippy.agent.traits:attention_guard
    method: run_tests

  # app:tools_delay_tool_test
  - name: tools_delay_tool_test
    kind: function.lua
    meta:
      name: Delay Tool Test
      type: test
      comment: Tests the delay tool echo and timing behavior
      group: Agent Framework
      tags:
        - tools
        - delay
        - tests
    source: file://tools/delay_tool_test.lua
    modules:
      - time
      - ctx
    imports:
      test: wippy.test:test
      delay_tool: app:delay_tool
    method: run_tests

  # app:traits_init_time_aware_test
  - name: traits_init_time_aware_test
    kind: function.lua
    meta:
      name: Init Time Aware Trait Test
      type: test
      comment: Tests the time-aware trait initialization and prompt generation
      group: Agent Framework
      tags:
        - traits
        - time
        - tests
    source: file://traits/init_time_aware_test.lua
    modules:
      - time
      - ctx
    imports:
      test: wippy.test:test
      init_time_aware: wippy.agent.traits:init_time_aware
    method: run_tests

  # app:delay_tool
  - name: delay_tool
    kind: function.lua
    meta:
      name: Delayed Echo Tool
      type: tool
      comment: Test tool that echoes input with configurable delay and context inspection - for testing only
      group: Testing
      tags:
        - test
        - delay
        - echo
        - context
      input_schema: |
        {
          "type": "object",
          "properties": {
            "message": {
              "type": "string",
              "description": "The message to echo back",
              "default": "Hello"
            },
            "delay_ms": {
              "type": "number",
              "description": "Delay in milliseconds before responding",
              "default": 100,
              "minimum": 0
            }
          },
          "required": [],
          "additionalProperties": false
        }
    source: file://tools/delay_tool.lua
    modules:
      - time
      - ctx
    method: delayed_echo

  - name: tools_controls_runtime_test
    kind: function.lua
    meta:
      type: test
      suite: agent-runtime
    source: file://tools/controls_runtime_test.lua
    imports:
      test: wippy.test:test
      tool_caller: wippy.agent.tools:caller
    method: run_tests

  - name: control_fixture
    kind: function.lua
    meta:
      type: tool
      input_schema: '{"type":"object"}'
    source: file://tools/control_fixture.lua
    modules: [ctx]
    method: execute

  - name: control_wrapper_apply
    kind: function.lua
    source: file://tools/control_fixture.lua
    modules: [ctx]
    method: apply

  - name: control_wrapper_binding
    kind: contract.binding
    contracts:
      - contract: wippy.agent:tool_wrapper
        methods:
          apply: app:control_wrapper_apply

  - name: tools_controls_benchmark
    kind: function.lua
    meta:
      type: test
      suite: agent-benchmark
    source: file://tools/controls_benchmark.lua
    modules: [env, time, json]
    imports:
      benchmark: wippy.test:benchmark
      test: wippy.test:test
      tool_caller: wippy.agent.tools:caller
    method: run_tests

  - name: bench_samples
    kind: env.variable
    variable: WIPPY_BENCH_SAMPLES
    storage: app:env_storage

  - name: bench_warmup
    kind: env.variable
    variable: WIPPY_BENCH_WARMUP
    storage: app:env_storage

  - name: bench_size
    kind: env.variable
    variable: WIPPY_BENCH_SIZE
    storage: app:env_storage
