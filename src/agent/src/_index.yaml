version: "1.0"
namespace: wippy.agent

entries:
  - name: definition
    kind: ns.definition
    meta:
      title: Agent
      description: LLM agent framework with tool support and conversation management

  - name: execution_authority_imports
    kind: ns.requirement
    meta:
      description: "Optional host library binding: {execution_identity_resolver: host:library}. The library captures restrictions and resolves current native authority."
    default: {}
    targets:
      - entry: wippy.agent.tools:execution_authority
        path: .imports

  - name: refresh_perms
    kind: ns.requirement
    meta:
      description: "Refresh tool authority at execution boundaries when execution_authority_imports is bound. Disabled by default."
    default: false
    targets:
      - entry: wippy.agent:execution_authority_settings
        path: .meta.refresh_perms

  - name: execution_authority_settings
    kind: registry.entry
    meta:
      refresh_perms: false

  # Dependencies
  - name: dep.wippy.llm
    kind: "ns.dependency"
    meta:
      description: "LLM component"
    component: "wippy/llm"
    version: ">=v0.5.8"

  # wippy.agent:agent
  - name: agent
    kind: library.lua
    meta:
      type: library
      comment: Agent runner library for executing LLM agents with conversation and tool support
    source: file://agent.lua
    modules:
      - json
      - contract
      - funcs
    imports:
      prompt: wippy.llm:prompt
      llm: wippy.llm:llm
      output: wippy.llm:output

  # wippy.agent:context
  - name: context
    kind: library.lua
    meta:
      type: library
      comment: Agent context manager for loading, compilation, and runtime agent switching
      tags:
        - agents
        - context
        - runtime
        - switching
        - compilation
      description: "Provides a clean abstraction for managing agent lifecycle including loading agents by ID/name, \ncompilation with traits and tools, runtime agent/model switching, context merging, and caching.\nHandles the complexity of agent registry lookup, compilation, and state management while \nproviding simple methods for agent switching during execution (e.g., from control directives).\n"
    source: file://context.lua
    modules:
      - contract
      - security
    imports:
      agent: wippy.agent:agent
      agent_registry: wippy.agent.discovery:registry
      compiler: wippy.agent.compiler:compiler
      output: wippy.llm:output

  # wippy.agent:lifecycle_controller
  - name: lifecycle_controller
    kind: library.lua
    meta:
      type: library
      comment: Shared activation and deactivation state machine for agent hosts
    source: file://lifecycle_controller.lua

  - name: behavior_controls
    kind: library.lua
    meta:
      type: library
      comment: Validation and detached preparation of declarative behavior proposals
    source: file://behavior_controls.lua
    modules: [json]

  # wippy.agent:lifecycle_runtime
  - name: lifecycle_runtime
    kind: library.lua
    meta:
      type: library
      comment: Runtime dispatcher for trait-owned lifecycle contract bindings
    source: file://lifecycle_runtime.lua
    modules:
      - contract
    imports:
      behavior_controls: wippy.agent:behavior_controls

  # wippy.agent:checkpoint_runtime
  - name: checkpoint_runtime
    kind: library.lua
    meta:
      type: library
      comment: Runtime dispatcher for trait-owned checkpoint contract bindings
    source: file://checkpoint_runtime.lua
    modules:
      - contract

  # wippy.agent:memory
  - name: memory
    kind: contract.definition
    meta:
      comment: Memory recall interface for retrieving relevant contextual information
      tags:
        - memory
        - recall
        - retrieval
        - context
      description: Retrieves relevant memories based on current work and recent activity
    methods:
      - name: recall
        description: |
          Retrieve relevant memories based on what's currently being worked on and recent actions.

          Session and dataflow hosts supply binding context.agent_run containing
          host, agent, and run_context. Providers use that pointer for bounded
          history reads; returned event IDs are provenance anchors.
          Host identity refs do not grant authorization.

          The runner continues generation when recall fails. A provider error, a
          provider that cannot be opened, or a result without a valid memories
          list is reported as memory_recall_error on the agent step result;
          hosts expose it as lifecycle outcome.memory_recall_error and keep it
          in the step's persisted metadata. Skipped recall and an empty
          memories list are not errors.

          Recent actions should be string summaries describing what happened:
          - "user: How do I optimize my database?"
          - "assistant: Let me analyze your schema [called tools]"
          - "tool: analyze_db_schema(db=prod) -> found 3 missing indexes"
          - "delegated to: agent:specialist for API design"

          Returns memories ordered by relevance without scores.
        input_schemas:
          - definition: |
              {
                "type": "object",
                "properties": {
                  "working_on": {
                    "type": "string",
                    "description": "Brief description of current task or topic if any"
                  },
                  "recent_actions": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    },
                    "description": "Recent activity as string summaries or copies of messages"
                  },
                  "previous_memories": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    },
                    "description": "Previous memory IDs to avoid duplicates",
                    "default": []
                  },
                  "constraints": {
                    "type": "object",
                    "properties": {
                      "max_items": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 50,
                        "default": 5
                      },
                      "max_length": {
                        "type": "integer",
                        "description": "Maximum total character length of memories",
                        "default": 5000
                      },
                      "memory_types": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        },
                        "description": "Filter by memory types"
                      }
                    },
                    "default": {}
                  }
                },
                "required": ["recent_actions"]
              }
            format: application/schema+json
        output_schemas:
          - definition: |-
              {
                "type": "object",
                "properties": {
                  "memories": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "id": {
                          "type": "string",
                          "description": "Memory identifier"
                        },
                        "content": {
                          "type": "string",
                          "description": "Memory content"
                        },
                        "metadata": {
                          "type": "object",
                          "properties": {
                            "type": {
                              "type": "string",
                              "description": "Memory type classification"
                            },
                            "source": {
                              "type": "string",
                              "description": "Origin of this memory"
                            },
                            "created_at": {
                              "type": "string",
                              "format": "date-time"
                            }
                          }
                        }
                      },
                      "required": ["id", "content"]
                    },
                    "description": "Retrieved memories ordered by relevance"
                  }
                },
                "required": ["memories"]
              }
            format: application/schema+json

  # wippy.agent:run_context
  - name: run_context
    kind: contract.definition
    meta:
      comment: Provider-neutral read access to an agent run's context, history, and prompt slices.
      tags:
        - agents
        - context
        - history
        - prompt
        - session
        - dataflow
      description: |
        Read-only contract used by trait bindings, lifecycle handlers, checkpoints,
        and tools that need runner state without knowing whether the agent is
        executing inside a session or dataflow node. Callers pass a host ref and
        a bounded selector; implementations return normalized data and range
        metadata instead of exposing internal repositories.

        host.kind is an open runner name. host.id is the runner's stable opaque
        identity across every step and iteration; delegated children have distinct
        identities. Existing runner locator fields remain available to bindings.
        Identity references do not grant access or establish the acting principal.

        Every history event supplies author independently of its prompt role:
        user with the human principal id, agent with the producing agent id, or
        system for workflow and tool input. An agent may receive a user-role
        message authored by its parent. Producers use persisted authorship and
        authoritative input sources, never the prompt role alone. Existing
        execution identity supplies the acting principal.

        Selector semantics are intentionally provider-neutral:
        - all: full chronological history.
        - window: last N events in chronological order; omitted N defaults to 20.
        - since_id: events strictly after from_id.
        - range: events strictly after from_id and through to_id, inclusive.
          Missing from_id starts at the beginning; missing to_id is open ended.
        - checkpoint: events strictly after the supplied checkpoint_id.
        - since_checkpoint: provider's current/latest checkpoint cut.
        max_chars is applied after selector slicing and may return an empty
        event list with truncated=true if the first selected event exceeds the
        bound.
    methods:
      - name: get_context
        description: Return the current runtime context map for the referenced agent run.
        input_schemas:
          - definition: |
              {
                "type": "object",
                "properties": {
                  "host": {
                    "type": "object",
                    "properties": {
                      "kind": { "type": "string", "minLength": 1 },
                      "id": { "type": "string", "minLength": 1 },
                      "session_id": { "type": "string" },
                      "dataflow_id": { "type": "string" },
                      "node_id": { "type": "string" },
                      "run_id": { "type": "string" },
                      "iteration": { "type": "integer" }
                    },
                    "required": ["kind"]
                  },
                  "agent": {
                    "type": "object",
                    "properties": {
                      "id": { "type": "string" },
                      "model": { "type": "string" }
                    }
                  }
                },
                "required": ["host"]
              }
            format: application/schema+json
        output_schemas:
          - definition: |
              {
                "type": "object",
                "properties": {
                  "context": { "type": "object" },
                  "host": { "type": "object" },
                  "agent": { "type": "object" }
                },
                "required": ["context"]
              }
            format: application/schema+json
      - name: get_history
        description: Return normalized conversation/history events for a bounded selector.
        input_schemas:
          - definition: |
              {
                "type": "object",
                "properties": {
                  "host": { "type": "object" },
                  "selector": {
                    "type": "object",
                    "properties": {
                      "mode": {
                        "type": "string",
                        "enum": ["all", "window", "range", "since_id", "since_checkpoint", "checkpoint"]
                      },
                      "from_id": { "type": "string" },
                      "to_id": { "type": "string" },
                      "checkpoint_id": { "type": "string" },
                      "last": { "type": "integer", "minimum": 1 },
                      "max_chars": { "type": "integer", "minimum": 1 }
                    },
                    "default": { "mode": "since_checkpoint" }
                  }
                },
                "required": ["host"]
              }
            format: application/schema+json
        output_schemas:
          - definition: |
              {
                "type": "object",
                "properties": {
                  "events": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "id": { "type": "string" },
                        "role": { "type": "string" },
                        "author": {
                          "type": "object",
                          "properties": {
                            "kind": { "type": "string", "enum": ["user", "agent", "system"] },
                            "id": { "type": "string" }
                          },
                          "required": ["kind"]
                        }
                      }
                    }
                  },
                  "range": {
                    "type": "object",
                    "properties": {
                      "from_id": { "type": "string" },
                      "to_id": { "type": "string" },
                      "checkpoint_id": { "type": "string" }
                    }
                  },
                  "truncated": { "type": "boolean" },
                  "count": { "type": "integer" }
                },
                "required": ["events"]
              }
            format: application/schema+json
      - name: get_prompt
        description: Render a bounded history selector as normalized prompt messages and/or text.
        input_schemas:
          - definition: |
              {
                "type": "object",
                "properties": {
                  "host": { "type": "object" },
                  "selector": { "type": "object" },
                  "format": {
                    "type": "string",
                    "enum": ["messages", "text", "both"],
                    "default": "messages"
                  }
                },
                "required": ["host"]
              }
            format: application/schema+json
        output_schemas:
          - definition: |
              {
                "type": "object",
                "properties": {
                  "messages": {
                    "type": "array",
                    "items": { "type": "object" }
                  },
                  "text": { "type": "string" },
                  "range": { "type": "object" },
                  "truncated": { "type": "boolean" }
                }
              }
            format: application/schema+json

  # wippy.agent:lifecycle
  - name: lifecycle
    kind: contract.definition
    meta:
      comment: Trait-owned agent lifecycle hook for sessions and dataflow.
      tags: [agents, traits, lifecycle, session, dataflow]
      description: |
        Agent-scoped lifecycle extension point. Runners call this contract for
        trait-owned bindings on the currently active compiled agent. If no trait
        binds lifecycle, runners continue with their built-in behavior.

        Bindings receive only stable refs: host, agent, outcome/reason, and a
        run_context pointer. They do not receive repository objects or runner
        internals. A binding that needs history or prompt slices opens
        run_context.binding for run_context.contract and calls get_context,
        get_history, or get_prompt with the supplied host.

        Returned messages are appended to the current prompt only by phases that
        run before an LLM step (activate and before_step today). They are
        per-step context: developer messages sit after the conversation cache
        breakpoint, so they never alter the cached prompt prefix. Durable memory,
        checkpoint, or audit writes belong inside the binding implementation.
        Multiple bindings may be attached by multiple traits; the compiler orders
        them by priority and declaration order.

        A binding without a phase list receives activate, before_step,
        after_step and deactivate. after_persist reaches only bindings that list
        it explicitly.

        Phase semantics:
        - activate: a compiled agent becomes active in this runner. On an agent
          switch, the old agent receives deactivate before the new one activates.
        - before_step: just before the current agent calls the LLM; returned
          messages can add prompt context for this step.
        - after_step: after the agent step result is known, before the host
          stores it.
        - after_persist: after the host commits the step's assistant/action
          record and that record is readable through the supplied run_context.
          refs.event_id is the record's history id as returned by
          run_context get_history. outcome is the after_step outcome. It may run
          before tool execution and does not imply tool results or the host run
          are stored. Returned messages and _control are ignored. Delivery is
          synchronous with no crash-recovery or exactly-once guarantee;
          providers derive idempotency keys from host identity and event_id.
        - deactivate: the active agent leaves the runner because the host
          finished, failed, or switched to another agent.
    methods:
      - name: apply
        description: Apply one lifecycle phase for the active compiled agent.
        input_schemas:
          - definition: |
              {
                "type": "object",
                "properties": {
                  "phase": {
                    "type": "string",
                    "enum": ["activate", "before_step", "after_step", "after_persist", "deactivate"]
                  },
                  "host": { "type": "object" },
                  "agent": { "type": "object" },
                  "reason": { "type": "string" },
                  "outcome": {
                    "type": "object",
                    "properties": {
                      "memory_recall_error": { "type": "string" }
                    }
                  },
                  "refs": {
                    "type": "object",
                    "properties": {
                      "event_id": { "type": "string", "minLength": 1 }
                    }
                  },
                  "run_context": {
                    "type": "object",
                    "properties": {
                      "contract": { "type": "string" },
                      "binding": { "type": "string" },
                      "host": { "type": "object" },
                      "agent": { "type": "object" }
                    }
                  },
                  "options": { "type": "object" }
                },
                "required": ["phase", "host"]
              }
            format: application/schema+json
        output_schemas:
          - definition: |
              {
                "type": "object",
                "properties": {
                  "_control": {
                    "type": "object",
                    "description": "Opt-in behavior proposals; step controls take effect only after the round is recorded.",
                    "properties": {
                      "config": { "type": "object" },
                      "context": { "type": "object" },
                      "memory": { "type": "object", "properties": { "compact": { "type": "boolean" } } }
                    }
                  },
                  "messages": { "type": "array", "items": { "type": "object" } },
                  "context": { "type": "object" },
                  "observations": { "type": "array", "items": { "type": "object" } },
                  "metadata": { "type": "object" }
                }
              }
            format: application/schema+json

  # wippy.agent:checkpoint
  - name: checkpoint
    kind: contract.definition
    meta:
      comment: Trait-owned checkpoint provider.
      tags: [agents, traits, memory, checkpoint, session, dataflow]
      description: |
        Canonical token-threshold checkpoint hook for sessions and dataflow.
        The runner decides when a checkpoint is needed; the binding decides how
        to read, summarize, and optionally persist durable memory using the
        run_context contract and selector.
    methods:
      - name: create
        input_schemas:
          - definition: |
              {
                "type": "object",
                "properties": {
                  "host": { "type": "object" },
                  "agent": { "type": "object" },
                  "reason": { "type": "string" },
                  "selector": { "type": "object" },
                  "run_context": { "type": "object" },
                  "options": { "type": "object" },
                  "context": { "type": "object" },
                  "refs": { "type": "object" }
                },
                "required": ["host"]
              }
            format: application/schema+json
        output_schemas:
          - definition: |
              {
                "type": "object",
                "properties": {
                  "memory": { "type": "string" },
                  "summary": { "type": "string" },
                  "metadata": { "type": "object" },
                  "tokens": { "type": "object" }
                }
              }
            format: application/schema+json

  # wippy.agent:tool_wrapper
  - name: tool_wrapper
    kind: contract.definition
    meta:
      comment: Trait-owned wrapper around agent tool execution.
      tags:
        - agents
        - traits
        - tools
        - session
        - dataflow
      description: |
        Allows a trait to inspect or adjust tool calls before execution and inspect
        tool results after execution. Session and dataflow runners supply the host
        reference; the wrapper owns no memory or checkpoint lifecycle. Traits can
        attach multiple focused bindings and each binding is invoked only for the
        phases declared by that trait.

        Before-execute adjustments must preserve every original tool-call ID
        exactly once. Tool names and arguments may change and calls may reorder,
        but an ID cannot be dropped, added, duplicated, or replaced: providers
        pair tool results with the original IDs. Violations fail validation.
    methods:
      - name: apply
        description: Apply one wrapper phase to an agent tool execution.
        input_schemas:
          - definition: |
              {
                "type": "object",
                "properties": {
                  "phase": {
                    "type": "string",
                    "enum": ["before_execute", "after_execute"]
                  },
                  "host": {
                    "type": "object",
                    "properties": {
                      "kind": { "type": "string", "minLength": 1 },
                      "id": { "type": "string", "minLength": 1 },
                      "session_id": { "type": "string" },
                      "dataflow_id": { "type": "string" },
                      "node_id": { "type": "string" },
                      "run_id": { "type": "string" },
                      "iteration": { "type": "integer" }
                    },
                    "required": ["kind"]
                  },
                  "agent": {
                    "type": "object",
                    "properties": {
                      "id": { "type": "string" },
                      "model": { "type": "string" }
                    }
                  },
                  "run_context": {
                    "type": "object",
                    "description": "Pointer to the provider-neutral run_context binding for this host ref.",
                    "properties": {
                      "contract": { "type": "string" },
                      "binding": { "type": "string" },
                      "host": { "type": "object" },
                      "agent": { "type": "object" }
                    }
                  },
                  "tool_calls": {
                    "type": "array",
                    "items": { "type": "object" }
                  },
                  "tool_results": {
                    "type": "object"
                  },
                  "outcome": {
                    "type": "object",
                    "properties": {
                      "state": {
                        "type": "string",
                        "enum": ["continues", "completed", "failed", "delegated"]
                      },
                      "reason": {
                        "type": "string",
                        "enum": [
                          "tool_results_recorded",
                          "tool_execution_failed",
                          "exit_tool_completed",
                          "delegation_requested",
                          "no_tools_required",
                          "max_iterations_reached",
                          "context_limit_reached",
                          "host_failed"
                        ]
                      }
                    },
                    "required": ["state", "reason"]
                  },
                  "options": {
                    "type": "object",
                    "description": "Trait-declared options for this wrapper."
                  }
                },
                "required": ["phase", "host", "tool_calls"]
              }
            format: application/schema+json
        output_schemas:
          - definition: |
              {
                "type": "object",
                "properties": {
                  "_control": {
                    "type": "object",
                    "description": "Opt-in after_execute behavior proposals; the host applies them after every outcome is recorded.",
                    "properties": {
                      "config": { "type": "object" },
                      "context": { "type": "object" },
                      "memory": { "type": "object", "properties": { "compact": { "type": "boolean" } } }
                    }
                  },
                  "skipped": {
                    "type": "boolean"
                  },
                  "tool_calls": {
                    "type": "array",
                    "items": { "type": "object" }
                  },
                  "observations": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "level": { "type": "string", "enum": ["info", "warning", "error"] },
                        "code": { "type": "string" },
                        "content": {},
                        "metadata": { "type": "object" }
                      },
                      "required": ["level", "code", "content"]
                    }
                  },
                  "metadata": {
                    "type": "object"
                  }
                }
              }
            format: application/schema+json

  # wippy.agent:resolver
  - name: resolver
    kind: contract.definition
    meta:
      comment: Agent resolution contract for loading agent specs by ID
      description: |
        Contract for resolving agent identifiers to agent specifications.
        Applications provide bindings to handle resolution (e.g., skill: prefix).
        If no binding exists, context.lua falls back to direct registry lookup.
    methods:
      - name: resolve
        description: Resolve an agent identifier to an agent specification
        input_schemas:
          - definition: |
              {
                "type": "object",
                "properties": {
                  "agent_id": {
                    "type": "string",
                    "description": "Agent identifier (ID, name, or prefixed like skill:uuid)"
                  }
                },
                "required": ["agent_id"]
              }
            format: application/schema+json
        output_schemas:
          - definition: |
              {
                "type": "object",
                "description": "Agent specification for compilation"
              }
            format: application/schema+json
