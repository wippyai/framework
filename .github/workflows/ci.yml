name: CI

on:
  push:
    branches: [feature/*]
  pull_request:
    branches: [master]
  workflow_call:
  workflow_dispatch:
    inputs:
      verify_publication:
        description: Verify publication of all current module versions without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  runtime-contracts:
    name: Lua runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-wippy
        id: wippy
      - name: Test real runtime contracts
        env:
          WIPPY: ${{ steps.wippy.outputs.path }}
          RUNTIME_WORK_DIR: ${{ runner.temp }}/framework-runtime
        run: make test-runtime
  test-runner:
    name: Test runner regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WIPPY_FRAMEWORK_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-wippy
        id: wippy
      - name: Add verified Wippy to PATH
        env:
          WIPPY_BIN: ${{ steps.wippy.outputs.path }}
        run: dirname "$WIPPY_BIN" >> "$GITHUB_PATH"
      - name: Install harness dependencies and lint
        run: |
          for harness in runner runner-results runner-hook-failure runner-timeout; do
            (
              cd "test-harness/$harness"
              wippy install
              wippy lint --level error
            )
          done
      - name: Test verdicts and the real CLI
        run: |
          (cd src/test && wippy install && wippy lint --level error && wippy test)
          (cd test-harness/runner && wippy test)
          bash test-harness/runner-results/verify.sh
          bash test-harness/runner-hook-failure/verify.sh
          bash test-harness/runner-timeout/verify-timeouts.sh

  manifests:
    name: Module manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/check_module_manifests.py
      - run: python3 -B -m unittest discover -s scripts -p '*_test.py'

  publication:
    name: Publication check
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_publication }}
    needs: [manifests, lint, test, test-runner]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check publication token
        env:
          WIPPY_TOKEN: ${{ secrets.WIPPY_TOKEN }}
        run: bash scripts/check_publish_token.sh
      - id: wippy
        uses: ./.github/actions/setup-wippy
      - name: Check current module publications
        env:
          WIPPY: ${{ steps.wippy.outputs.path }}
          WIPPY_TOKEN: ${{ secrets.WIPPY_TOKEN }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r module_path version; do
            if [ -f "$module_path/src/wippy.yaml" ]; then
              module_dir="$module_path/src"
            else
              module_dir="$module_path"
            fi
            "$WIPPY" publish --config "$module_dir" --version "$version" --dry-run
          done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' .release-please-manifest.json)

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - actor
          - agent
          - bootloader
          - embeddings
          - facade
          - llm
          - migration
          - relay
          - usage
          - views
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Wippy
        run: |
          curl -fsSL https://hub.wippy.ai/install.sh -o /tmp/wippy-install.sh
          . /tmp/wippy-install.sh
          echo "$HOME/.wippy/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: src/${{ matrix.module }}/test
        run: wippy install

      - name: Lint
        working-directory: src/${{ matrix.module }}/test
        run: make lint

  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - actor
          - agent
          - bootloader
          - embeddings
          - facade
          - llm
          - migration
          - relay
          - usage
          - views
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Wippy
        run: |
          curl -fsSL https://hub.wippy.ai/install.sh -o /tmp/wippy-install.sh
          . /tmp/wippy-install.sh
          echo "$HOME/.wippy/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: src/${{ matrix.module }}/test
        run: wippy install

      - name: Test
        working-directory: src/${{ matrix.module }}/test
        run: make test

  migration-postgres:
    name: Migration concurrency (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kickside
          POSTGRES_PASSWORD: kickside
          POSTGRES_DB: up_migration_concurrency
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kickside -d up_migration_concurrency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-wippy
        id: wippy
      - name: Add verified Wippy to PATH
        env:
          WIPPY_BIN: ${{ steps.wippy.outputs.path }}
        run: dirname "$WIPPY_BIN" >> "$GITHUB_PATH"
      - name: Install dependencies
        working-directory: src/migration/test
        run: wippy install
      - name: Test both databases
        working-directory: src/migration/test
        run: make test-postgres
